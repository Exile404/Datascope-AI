# Monitoring stack for DataScope AI.
# Separate from prod so it survives prod crashes and can be torn down independently.
#
# Up:   docker compose -f docker-compose.monitor.yml up -d
# Down: docker compose -f docker-compose.monitor.yml down
#
# Scrapes:
#   - Backend /metrics on host:8000 via host.docker.internal
#   - cAdvisor (containers on this Docker daemon)
#   - node-exporter (host metrics)
services:
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: datascope-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    extra_hosts:
      # Reach host services (backend running on host:8000) from inside the container.
      - "host.docker.internal:host-gateway"
    networks:
      - monitor-net
    depends_on:
      - cadvisor
      - node-exporter

  cadvisor:
    # Google's container advisor: per-container CPU, mem, net, fs metrics.
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: datascope-cadvisor
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - monitor-net

  node-exporter:
    # Host-level metrics: CPU, RAM, disk, network, filesystem.
    image: prom/node-exporter:v1.8.2
    container_name: datascope-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    networks:
      - monitor-net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: datascope-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    networks:
      - monitor-net

  grafana:
    image: grafana/grafana:11.3.1
    container_name: datascope-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - monitor-net

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:

networks:
  monitor-net:
    name: datascope-monitor-net
    driver: bridge
