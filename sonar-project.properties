# DataScope AI — SonarCloud configuration
# Used by: Jenkins "Code Quality" stage via sonar-scanner

# ---- Project identity ----
sonar.projectKey=Exile404_Datascope-AI
sonar.organization=exile404
sonar.projectName=DataScope AI
sonar.projectVersion=0.2.0

# ---- Source roots ----
# We analyse backend Python and frontend TypeScript.
# Mock-ollama is excluded (tiny, single file, not worth metrics).
sonar.sources=backend/app,frontend/src

# ---- Test roots ----
sonar.tests=backend/tests

# ---- Language hints ----
# SonarCloud auto-detects, but explicit is safer for mixed-language projects.
sonar.python.version=3.12

# ---- Exclusions ----
# Don't analyse generated, cached, or vendored code.
sonar.exclusions=\
    **/__pycache__/**,\
    **/*-env/**,\
    **/.venv*/**,\
    **/node_modules/**,\
    **/.next/**,\
    **/build/**,\
    **/dist/**,\
    **/coverage/**,\
    ml/scripts/unsloth_compiled_cache/**,\
    backend/mock-ollama/**

# Test files shouldn't count toward main code metrics
sonar.test.exclusions=**/tests/**,**/*.test.tsx,**/*.test.ts

# ---- Coverage report (Python) ----
# pytest --cov writes this file; Jenkins stage will run before sonar
sonar.python.coverage.reportPaths=backend/coverage.xml

# ---- Source encoding ----
sonar.sourceEncoding=UTF-8

# ---- SCM provider (helps SonarCloud annotate blame) ----
sonar.scm.provider=git
