# Prometheus scrape configuration for DataScope AI.
# Targets: backend app metrics, cAdvisor (containers), node-exporter (host).

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: datascope-ai
    env: production

# Alertmanager wiring.
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Alert + recording rule files.
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Prometheus self-scrape (sanity check).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # DataScope backend app metrics.
  # Backend runs on the host (port 8000 in prod); reach it via host gateway.
  - job_name: datascope-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: backend
          tier: app

  # cAdvisor: per-container CPU, memory, network, fs.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          tier: container

  # node-exporter: host-level CPU, RAM, disk, network.
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          tier: host
